name: Create owned external-fork probe PR

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  create:
    if: "${{ github.event.head_commit.message == 'test: trigger external-fork PR creator' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Create the reversible owned-account PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/pulls" \
            -f title='test: Mergify external-fork trust boundary' \
            -f head='Celcious1:codex/mergify-fork-trust-probe' \
            -f base='main' \
            -f body='Owned-account, reversible security probe. The only fork change replaces a harmless repository-code marker. Final merge is blocked by the deliberately nonexistent codex-never-pass check; both API permission probes use invalid payloads and cannot create a ref or file.' \
            --jq '.html_url'
