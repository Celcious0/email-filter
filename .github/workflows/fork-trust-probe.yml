name: Mergify external-fork trust probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "mergify/merge-queue/**"

permissions:
  contents: write

jobs:
  permission-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Execute checked-out repository code
        shell: bash
        run: bash ./probe.sh

      - name: Compare GitHub token permission boundary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          PROBE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "CODEX_EVENT_NAME=${EVENT_NAME}"
          echo "CODEX_EVENT_REF=${EVENT_REF}"
          echo "CODEX_HEAD_REPOSITORY=${HEAD_REPOSITORY}"
          echo "CODEX_HEAD_IS_FORK=${HEAD_IS_FORK}"

          ref_code="$({
            curl --silent --show-error \
              --output /tmp/codex-ref-response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/git/refs" \
              --data "{\"ref\":\"refs/heads/\",\"sha\":\"${PROBE_SHA}\"}"
          } || true)"

          sleep 1.2

          content_code="$({
            curl --silent --show-error \
              --output /tmp/codex-content-response.json \
              --write-out '%{http_code}' \
              --request PUT \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/contents/codex-never-created" \
              --data '{"message":"","content":"%%%"}'
          } || true)"

          ref_message="$(jq -r '.message // ""' /tmp/codex-ref-response.json 2>/dev/null || true)"
          content_message="$(jq -r '.message // ""' /tmp/codex-content-response.json 2>/dev/null || true)"

          echo "CODEX_REF_ORACLE_STATUS=${ref_code}"
          echo "CODEX_REF_ORACLE_MESSAGE=${ref_message}"
          echo "CODEX_CONTENT_ORACLE_STATUS=${content_code}"
          echo "CODEX_CONTENT_ORACLE_MESSAGE=${content_message}"

          rm -f /tmp/codex-ref-response.json /tmp/codex-content-response.json
