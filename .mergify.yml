pull_request_rules:
  - name: queue owned fork trust probe
    conditions:
      - base = main
    actions:
      queue:

queue_rules:
  - name: default
    branch_protection_injection_mode: merge
    queue_conditions:
      - base = main
    merge_conditions:
      # This status can never exist. The probe can enter speculative CI but
      # cannot be merged by Mergify.
      - check-success = codex-never-pass
    # Any positive retry count forces checks onto a Mergify draft PR instead
    # of using in-place checks on the original fork.
    max_checks_retries: 1
